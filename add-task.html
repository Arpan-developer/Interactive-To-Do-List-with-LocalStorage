<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ToDoList - Add Task</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2 class="logo">
            <span>✓</span> ToDoList
        </h2>

        <nav>

            <a href="index.html">🏠 Home</a>

            <a href="tasks.html">
                ☷ All Tasks
            </a>

            <a class="active"
               href="add-task.html">
                ＋ Add Task
            </a>

            <a href="completed.html">
                ✓ Completed
            </a>

            <a href="settings.html">
                ⚙ Settings
            </a>

            <a href="about.html">
                ⓘ About
            </a>

        </nav>

    </aside>


    <main class="main form-page">

        <div class="page-heading">

            <div>

                <h1>Add New Task</h1>

                <p>
                    Fill in the details below to add a new task.
                </p>

            </div>

        </div>


        <form id="taskForm" class="form-card">

            <label>
                Task Title

                <input
                    id="taskTitle"
                    type="text"
                    placeholder="e.g. Learn JavaScript DOM"
                    required
                >

            </label>


            <label>
                Description

                <textarea
                    id="taskDescription"
                    placeholder="Add a short description..."
                ></textarea>

            </label>


            <div class="two-column">

                <label>
                    Due Date

                    <input
                        id="taskDate"
                        type="date"
                    >

                </label>


                <label>
                    Priority

                    <select id="taskPriority">

                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>

                    </select>

                </label>

            </div>


            <label>
                Category

                <select id="taskCategory">

                    <option>Study</option>
                    <option>Work</option>
                    <option>Development</option>
                    <option>Personal</option>

                </select>

            </label>


            <div class="form-actions">

                <a
                    href="tasks.html"
                    class="secondary-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Add Task
                </button>

            </div>

        </form>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
